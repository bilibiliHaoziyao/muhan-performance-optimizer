plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.muhan.socbatteryinfo'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.muhan.socbatteryinfo"
        minSdk 24
        targetSdk 35
        versionCode 77
        versionName "74.1"

        // 声明支持的 CPU 架构（本应用无 so 库，默认即全架构通用，此处显式声明）
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        release {
            // keystore 不提交到仓库：本地默认项目根目录 release.keystore，
            // CI 可通过环境变量注入（RELEASE_STORE_FILE / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD）
            storeFile file(System.getenv("RELEASE_STORE_FILE") ?: '../release.keystore')
            storePassword System.getenv("RELEASE_STORE_PASSWORD") ?: 'android'
            keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: 'muhan'
            keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // 使用默认调试签名，克隆仓库后无需 keystore 即可构建调试包
        }
    }

    // 沙箱环境的 lint 的 Kotlin 分析 (UAST) 会崩溃，跳过 release 构建的 lint 检查
    lint {
        checkReleaseBuilds = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Shizuku API 需要 core library desugaring（minSdk 21 < 26）
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Shizuku：通过 ADB Shell 权限执行命令
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}